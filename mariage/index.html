<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre mariage — Votre invitation</title>

<!-- Polices : une serif élégante pour les titres, une sans-serif discrète pour le reste -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Tailwind (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // ============================================================
  //  THEME — toute la palette et les tokens visuels sont ici.
  //  Pour changer l'identité graphique du site, ne toucher QUE
  //  cet objet (et les variables CSS juste en dessous).
  // ============================================================
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          sauge:  { DEFAULT: '#6e9957', dark: '#587b45', light: '#8bb072' },
          creme:  { DEFAULT: '#f5f0d7', dark: '#ece4c2' },
          gris:   { DEFAULT: '#c9c7bb', dark: '#a8a698' },
          lilas:  { DEFAULT: '#ebd8e8', dark: '#dcbdd8' },
          bleu:   { DEFAULT: '#b8d2de', dark: '#9abccb' },
          encre:  '#3f3c33', // texte principal, dérivé sobre du gris/creme
        },
        fontFamily: {
          display: ['"Cormorant Garamond"', 'serif'],
          body: ['Karla', 'sans-serif'],
        },
      }
    }
  }
</script>

<!-- Alpine.js -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<!-- EmailJS : permet d'envoyer un vrai mail depuis le navigateur, sans backend -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
  /* Variables CSS miroir du thème Tailwind, utiles pour les éléments
     qu'on ne peut pas styler proprement en classes utilitaires
     (traits de timeline, focus visible, etc.) */
  :root{
    --sauge: #6e9957;
    --creme: #f5f0d7;
    --gris:  #c9c7bb;
    --lilas: #ebd8e8;
    --bleu:  #b8d2de;
    --encre: #3f3c33;
  }
  body{ font-family: 'Karla', sans-serif; }
  .font-display{ font-family: 'Cormorant Garamond', serif; }

  /* focus clavier visible, sobre, dans la teinte sauge */
  :focus-visible{
    outline: 2px solid var(--sauge);
    outline-offset: 2px;
  }

  /* transition douce par défaut sur les éléments interactifs */
  button, a { transition: all .15s ease; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>

<style>
.contact-card {
  text-align: center;
}
.contact-card__title {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: .45rem;
}
.contact-card__text {
  margin-bottom: .8rem;
  opacity: .8;
}
.contact-card__links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .65rem 1rem;
}
.contact-card__links a {
  text-decoration: none;
}
</style>

</head>

<body class="bg-creme text-encre min-h-screen antialiased">

<div x-data="guestApp()" x-init="init()" class="min-h-screen flex flex-col">

  <!-- ============================================================
       EN-TÊTE
       ============================================================ -->
  <header class="border-b border-gris/60 bg-creme/95 backdrop-blur sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-baseline gap-2">
        <span class="font-display text-2xl tracking-wide">Tom <span class="text-sauge">&amp;</span> Mélanie</span>
      </div>
      <span class="hidden sm:inline text-xs uppercase tracking-[0.2em] text-encre/50">22 — 25 avril 2027</span>
    </div>
  </header>

  <main class="flex-1 max-w-3xl mx-auto w-full px-6 py-10 sm:py-14">

    <!-- ============================================================
         CAS 1 : identifiant absent ou inconnu
         ============================================================ -->
    <template x-if="!entry">
      <section class="text-center py-10">
        <h1 class="font-display text-3xl sm:text-4xl mb-3">Invitation introuvable</h1>
        <p class="text-encre/70 max-w-md mx-auto leading-relaxed">
          Le lien que vous avez utilisé ne correspond à aucune invitation connue.
          Vérifiez le QR code de votre faire-part, ou contactez-nous directement.
        </p>
      </section>
    </template>

    <!-- ============================================================
         CAS 2 : identifiant valide → récapitulatif de l'invitation
         ============================================================ -->
    <template x-if="entry">
      <div class="space-y-10">

        <!-- Salutation -->
        <section class="text-center">
          <p class="uppercase tracking-[0.2em] text-xs text-sauge-dark mb-2">Votre invitation</p>
          <h1 class="font-display text-3xl sm:text-4xl leading-snug">
            Bonjour <span x-text="entry.persons.map(p => p.prenom).join(', ')"></span>
          </h1>
          <p class="text-encre/60 mt-2 text-sm">
            Voici le déroulé de ce à quoi vous êtes convié·es.
          </p>
        </section>

        <section class="bg-white/60 border border-gris/70 rounded-2xl p-5 sm:p-7 contact-card" aria-label="Coordonnées des mariés">
          <div class="contact-card__title">Une question ? 💌</div>
          <div class="contact-card__text">
            N'hésitez pas à nous contacter si vous avez une question !
          </div>
          <div class="contact-card__links">
            <a href="mailto:tom.befieux@gmail.com">✉️ tom.befieux@gmail.com</a>
            <a href="tel:+33627544237">📱 06 27 54 24 37</a>
          </div>
        </section>

        <!-- Synthèse générale des règles de tenue -->
        <section class="bg-lilas/30 border border-gris/60 rounded-2xl px-5 py-4 text-sm text-encre/80">
          <p class="font-medium text-encre mb-2 flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-encre/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10a2 2 0 002 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg>
            Tenue de rigueur
          </p>
          <ul class="space-y-1 leading-relaxed">
            <li>— Mairie : pas de noir, pas de blanc ou de beige/écru,.</li>
            <li>— Cérémonie &amp; repas du soir : pas de blanc, beige/écru, noir ou vert — sauf couleur de tenue imposée, précisée pour certain·es dans le déroulé ci-dessous.</li>
            <li>— Brunch : tenue blanche obligatoire, pour tout le monde.</li>
          </ul>
        </section>

        <br/>TODO: rajouter info pour ceux qui dorment genre il y a une salle de bain et des serviette genre ?
        TODO: Mettre plus en avant la couleur imposée des tenues
        TODO: mettre addresses des événements

        <!-- Un bloc par groupe de personnes partageant exactement
             le même programme (mêmes événements, mêmes nuits, même chambre) -->
        <template x-for="group in personGroups" :key="group.key">
          <section class="bg-white/60 border border-gris/70 rounded-2xl p-5 sm:p-7">

            <!-- Noms des personnes concernées par ce programme -->
            <div class="flex flex-wrap items-center gap-2 mb-6">
              <template x-for="p in group.persons" :key="p.id">
                <span class="px-3 py-1 rounded-full bg-bleu/50 text-sm font-medium">
                  <span x-text="p.prenom + ' ' + p.nom"></span>
                </span>
              </template>
              <template x-if="group.room">
                <span class="ml-auto px-3 py-1 rounded-full bg-lilas/60 text-sm flex items-center gap-1.5">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v11m0-4h18m0 4V10a2 2 0 00-2-2h-7a2 2 0 00-2 2v4M3 7l4-4h9l4 4"/></svg>
                  Chambre : 
                  <span x-text="group.room"></span>
                </span>
              </template>
            </div>

            <!-- ==================================================
                 TIMELINE — élément signature de la page.
                 Un déroulé chronologique réel (jeudi → dimanche),
                 chaque étape active ou non selon le programme,
                 avec les nuitées indiquées entre les étapes.
                 ================================================== -->
            <ol class="relative">
              <template x-for="(step, idx) in group.timeline" :key="step.key">
                <template x-if="step.active">
                  <li class="relative pl-9 sm:pl-11" :class="idx !== group.timeline.length - 1 ? 'pb-7' : ''">

                    <!-- trait vertical reliant les étapes -->
                    <span x-show="idx !== group.timeline.length - 1 && group.timeline[idx+1].active"
                          class="absolute left-[11px] sm:left-[13px] top-6 bottom-0 w-px"
                          :class="step.active ? 'bg-sauge' : 'bg-gris'"></span>

                    <!-- pastille -->
                    <span class="absolute left-0 top-0.5 w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center border-2"
                          :class="step.active
                            ? 'bg-sauge border-sauge text-white'
                            : 'bg-creme border-gris text-gris'">
                      <svg x-show="step.active" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </span>

                    <div :class="step.active ? '' : 'opacity-45'">
                      <p class="font-display text-xl leading-tight" x-text="step.label"></p>
                      <p class="text-xs uppercase tracking-wide text-encre/50 mt-0.5">
                        <span x-text="step.day"></span> · <span x-text="step.time"></span>
                      </p>
                      <p class="text-sm text-encre/70 mt-1" x-text="step.desc"></p>

                      <!-- règle de tenue pour cette étape -->
                      <template x-if="step.active && step.dressRule">
                        <div class="mt-2.5 flex items-start gap-1.5 text-xs text-encre/60">
                          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10a2 2 0 002 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg>
                          <div>
                            <span x-text="step.dressRule"></span>
                            <template x-if="step.dressOverrides.length">
                              <div class="mt-1.5 flex flex-wrap gap-1.5">
                                <template x-for="o in step.dressOverrides" :key="o.prenom + o.nom">
                                  <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-white border border-gris/70">
                                    <span class="w-2.5 h-2.5 rounded-full border border-encre/20 shrink-0" :style="'background:' + o.color"></span>
                                    <span x-text="o.prenom + ' : couleur imposée'"></span>
                                  </span>
                                </template>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>

                    <!-- indicateur de nuitée entre deux étapes -->
                    <template x-if="step.nightAfter && step.nightAfter.active">
                      <div class="mt-3 flex items-center gap-2 text-xs text-encre/60">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" :class="step.nightAfter.active ? 'text-sauge-dark' : 'text-gris'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a8.997 8.997 0 008.354-5.646z"/></svg>
                        <span :class="step.nightAfter.active ? 'text-encre' : 'text-encre/40 line-through'" x-text="step.nightAfter.label"></span>
                      </div>
                    </template>
                  </li>
                </template>
              </template>
            </ol>

            <!-- ==================================================
                 RÉPONSES — une réponse par événement et par personne
                 ================================================== -->
            <div class="mt-8 pt-6 border-t border-gris/60 space-y-5">
              <p class="text-sm text-encre/60">
                Indiquez votre présence pour <strong>chaque événement</strong> auquel vous êtes convié·e,
                puis envoyez toutes vos réponses en une seule fois.
              </p>

              <template x-for="p in group.persons" :key="p.id">
                <div class="bg-creme/70 rounded-xl px-4 py-4 space-y-3">
                  <div class="flex items-center gap-2">
                    <span class="font-medium" x-text="p.prenom + ' ' + p.nom"></span>
                    <template x-if="p.dressCode">
                      <span class="w-3 h-3 rounded-full border border-encre/20 shrink-0"
                            :style="'background:' + p.dressCode"
                            :title="'Couleur imposée : ' + p.dressCode"></span>
                    </template>
                  </div>

                  <div class="space-y-2">
                    <template x-for="ev in EVENTS.filter(e => p.events.includes(e.key))" :key="ev.key">
                      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 bg-white/70 rounded-lg px-3 py-2.5">
                        <div class="flex-1 min-w-0">
                          <p class="text-sm font-medium" x-text="ev.label"></p>
                          <p class="text-xs text-encre/50" x-text="ev.day + ' · ' + ev.time"></p>
                        </div>

                        <template x-if="!submitted">
                          <div class="flex gap-2 shrink-0">
                            <button type="button" @click="setRsvp(p.id, ev.key, 'yes')"
                              class="px-3.5 py-1.5 rounded-full text-sm font-medium border"
                              :class="p.rsvp[ev.key] === 'yes'
                                ? 'bg-sauge text-white border-sauge'
                                : 'bg-white border-gris text-encre/70 hover:border-sauge hover:text-sauge-dark'">
                              Je viens
                            </button>
                            <button type="button" @click="setRsvp(p.id, ev.key, 'no')"
                              class="px-3.5 py-1.5 rounded-full text-sm font-medium border"
                              :class="p.rsvp[ev.key] === 'no'
                                ? 'bg-encre text-creme border-encre'
                                : 'bg-white border-gris text-encre/70 hover:border-encre'">
                              Je ne pourrai pas venir
                            </button>
                          </div>
                        </template>
                        <template x-if="submitted">
                          <span class="shrink-0 text-xs px-3 py-1.5 rounded-full font-medium"
                                :class="p.rsvp[ev.key] === 'yes' ? 'bg-sauge/20 text-sauge-dark' : 'bg-encre/10 text-encre/70'"
                                x-text="p.rsvp[ev.key] === 'yes' ? 'Présent·e' : 'Absent·e'"></span>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

            </div>
          </section>
        </template>

        <!-- ============================================================
             ENVOI GLOBAL DES RÉPONSES
             ============================================================ -->
        <section class="bg-white/60 border border-gris/70 rounded-2xl p-5 sm:p-7">
          <template x-if="!submitted">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="font-medium">Vos réponses sont-elles complètes ?</p>
                <p x-show="hasMissingRsvp" class="text-sm text-encre/60 mt-1">
                  Il reste au moins une réponse à renseigner pour une personne.
                </p>
                <p x-show="!hasMissingRsvp" class="text-sm text-sauge-dark mt-1">
                  Toutes les réponses ont été renseignées.
                </p>
              </div>
              <button type="button" @click="submitRsvps()"
                class="px-5 py-2.5 rounded-full bg-sauge text-white font-medium hover:bg-sauge-dark disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
                :disabled="hasMissingRsvp || sending">
                <span x-text="sending ? 'Envoi en cours…' : 'Envoyer mes réponses'"></span>
              </button>
            </div>
          </template>

          <template x-if="submitted">
            <div class="text-center">
              <template x-if="!emailError">
                <p class="font-medium text-sauge-dark">Merci, vos réponses ont bien été transmises !</p>
              </template>
              <template x-if="emailError">
                <p class="font-medium text-encre">Vos réponses sont enregistrées.</p>
              </template>
              <p class="text-sm text-encre/60 mt-1">
                Nous nous en occupons, vous n'avez rien d'autre à faire. Une erreur à corriger ?
                <button type="button" @click="reopenForm()" class="underline hover:text-encre">Modifier mes réponses</button>
              </p>
              <template x-if="emailError">
                <div>
                  <p class="text-xs text-encre/40 mt-4">
                    Votre logiciel de messagerie a dû s'ouvrir avec le message prêt : pensez à cliquer sur « Envoyer » dedans.
                    S'il ne s'est pas ouvert, copiez ce texte et envoyez-le nous à
                    <a href="mailto:tom.befieux@gmail.com" class="underline">tom.befieux@gmail.com</a> :
                  </p>
                  <textarea readonly rows="3" x-text="lastMailBody" @focus="$event.target.select()"
                    class="w-full mt-2 text-xs bg-creme border border-gris/60 rounded-lg p-2 font-mono text-left"></textarea>
                </div>
              </template>
            </div>
          </template>
        </section>

        <!-- confirmation discrète après enregistrement -->
        <div x-show="justSaved" x-transition x-cloak
             class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-encre text-creme text-sm px-4 py-2.5 rounded-full shadow-lg">
          Réponse enregistrée — merci !
        </div>

      </div>
    </template>

  </main>

  <footer class="text-center text-xs text-encre/40 py-8">
    Avec toute notre affection — Tom &amp; Mélanie
  </footer>

</div>

    // ============================================================
    //  ÉTAT
    // ============================================================
    // ============================================================
    //  ENVOI DE MAIL (EmailJS) — À COMPLÉTER
    //  service_pj3xp2n est déjà votre service Gmail. Il manque encore :
    //  1. EMAILJS_TEMPLATE_ID : créez un modèle dans EmailJS
    //     (Email Templates → Create New Template) relié à ce service,
    //     avec un champ "To Email" fixé sur tom.befieux@gmail.com et,
    //     dans le corps, les variables {{subject}} et {{message}}.
    //     Récupérez son ID sur la page du modèle.
    //  2. EMAILJS_PUBLIC_KEY : Account → General → Public Key, dans
    //     votre tableau de bord EmailJS.
    // ============================================================
    EMAILJS_SERVICE_ID: 'service_pj3xp2n',
    EMAILJS_TEMPLATE_ID: 'template_ppjo9fq',
    EMAILJS_PUBLIC_KEY: 'lxN87v_ZjNqSjmI-f',

    entry: null,        // { persons: [...] } correspondant à l'id de l'URL
    guestId: null,
    justSaved: false,
    submitted: false,   // true une fois les réponses envoyées : verrouille le formulaire
    sending: false,
    emailError: false,
    lastMailBody: '',

    init(){
      emailjs.init({ publicKey: this.EMAILJS_PUBLIC_KEY });

      const params = new URLSearchParams(window.location.search);
      this.guestId = (params.get('id') || '').toUpperCase();

      const base = this.GUESTS[this.guestId];
      if(!base) return; // -> template "invitation introuvable"

      // On clone les données de base et on applique les réponses RSVP
      // éventuellement déjà enregistrées localement (persistance légère
      // côté navigateur — sur un vrai déploiement, remplacer par un appel
      // à un backend / une feuille de calcul partagée).
      const saved = this.loadLocalRsvp();
      this.entry = {
        persons: base.persons.map(p => ({
          ...p,
          rsvp: this.normalizeRsvp(saved[p.id] !== undefined ? saved[p.id] : p.rsvp, p.events)
        }))
      };

      // Si cette personne a déjà envoyé ses réponses sur cet appareil,
      // le formulaire reste verrouillé pour éviter les envois en double.
      this.submitted = localStorage.getItem('submitted_' + this.guestId) === '1';
    },

    // --- persistance locale des réponses (démo, remplaçable) ---
    loadLocalRsvp(){
      try{
        return JSON.parse(localStorage.getItem('rsvp_' + this.guestId)) || {};
      }catch(e){ return {}; }
    },
    normalizeRsvp(value, events){
      // Compatibilité avec les anciennes données : un RSVP global yes/no
      // est reporté sur tous les événements auxquels la personne est invitée.
      if(value && typeof value === 'object' && !Array.isArray(value)){
        return { ...value };
      }
      const map = {};
      events.forEach(key => map[key] = (value === 'yes' || value === 'no') ? value : null);
      return map;
    },

    saveLocalRsvp(){
      const map = {};
      this.entry.persons.forEach(p => map[p.id] = p.rsvp);
      localStorage.setItem('rsvp_' + this.guestId, JSON.stringify(map));
    },

    setRsvp(personId, eventKey, value){
      const person = this.entry.persons.find(p => p.id === personId);
      if(!person) return;
      person.rsvp[eventKey] = value;
    },

    get hasMissingRsvp(){
      if(!this.entry) return false;
      return this.entry.persons.some(p =>
        p.events.some(eventKey => p.rsvp[eventKey] !== 'yes' && p.rsvp[eventKey] !== 'no')
      );
    },

    async submitRsvps(){
      if(this.hasMissingRsvp || this.submitted || this.sending) return;
      this.saveLocalRsvp();
      this.sending = true;
      await this.sendEmail();
      this.sending = false;
      this.submitted = true;
      localStorage.setItem('submitted_' + this.guestId, '1');
      this.justSaved = true;
      setTimeout(() => this.justSaved = false, 2500);
    },

    // Envoie le mail via EmailJS (donc directement, sans que la personne
    // ait quoi que ce soit à faire ensuite). Si ça échoue pour une
    // raison ou une autre (config incomplète, coupure réseau...), on
    // retombe sur l'ouverture du client mail avec le message pré-rempli,
    // pour ne jamais perdre la réponse de la personne.
    async sendEmail(){
      const subject = `Réponse à l'invitation — ${this.guestId}`;
      const lines = [`Faire-part : ${this.guestId}`, ''];
      this.entry.persons.forEach(p => {
        lines.push(`${p.prenom}${p.nom ? ' ' + p.nom : ''} :`);
        p.events.forEach(key => {
          const ev = this.EVENTS.find(e => e.key === key);
          const label = ev ? ev.label : key;
          lines.push('  - ' + label + ' : ' + (p.rsvp[key] === 'yes' ? 'Présent·e' : 'Absent·e'));
        });
        lines.push('');
      });
      this.lastMailBody = lines.join('\n');

      const canUseEmailJS = typeof emailjs !== 'undefined';

      if(canUseEmailJS){
        try{
          await emailjs.send(this.EMAILJS_SERVICE_ID, this.EMAILJS_TEMPLATE_ID, {
            subject: subject,
            message: this.lastMailBody,
            guest_id: this.guestId,
          });
          this.emailError = false;
          return;
        }catch(err){
          console.error('Échec de l\'envoi via EmailJS :', err);
        }
      }

      // Repli : configuration EmailJS incomplète, ou envoi en échec.
      this.emailError = true;
      const mailto = 'mailto:tom.befieux@gmail.com'
        + '?subject=' + encodeURIComponent(subject)
        + '&body=' + encodeURIComponent(this.lastMailBody);
      const a = document.createElement('a');
      a.href = mailto;
      a.click();
    },

    // Permet de rouvrir le formulaire en cas d'erreur à corriger,
    // avec une confirmation explicite pour éviter les envois accidentels.
    reopenForm(){
      if(confirm('Vous avez déjà transmis vos réponses. Voulez-vous les modifier et nous les renvoyer ?')){
        this.submitted = false;
      }
    },

    // ============================================================
    //  REGROUPEMENT DES PERSONNES PAR PROGRAMME IDENTIQUE
    //  Deux personnes partagent un bloc/timeline si elles ont
    //  exactement les mêmes événements, les mêmes nuitées et la
    //  même chambre.
    // ============================================================
    get personGroups(){
      if(!this.entry) return [];

      const groups = new Map();

      this.entry.persons.forEach(p => {
        const key = [...p.events].sort().join(',') + '|' +
                    [...p.nights].sort().join(',') + '|' +
                    (p.room || '');

        if(!groups.has(key)){
          groups.set(key, {
            key,
            room: p.room,
            events: p.events,
            nights: p.nights,
            persons: [],
          });
        }
        groups.get(key).persons.push(p);
      });

      // Construction de la timeline (déroulé + nuitées intercalées)
      // pour chaque groupe, dans l'ordre chronologique de EVENTS.
      return Array.from(groups.values()).map(group => {
        const timeline = this.EVENTS.map(ev => {
          const nightAfterDef = this.NIGHTS.find(n => n.after === ev.key);
          const rule = this.DRESS_RULES[ev.key] || null;

          // Personnes du groupe ayant une tenue imposée, uniquement
          // pertinent pour les événements où la règle générale peut
          // être exemptée (pas pour le brunch, tenue blanche pour tous).
          const dressOverrides = (rule && rule.overridable)
            ? group.persons.filter(p => p.dressCode).map(p => ({
                prenom: p.prenom, nom: p.nom, color: p.dressCode
              }))
            : [];

          return {
            key: ev.key,
            label: ev.label,
            day: ev.day,
            time: ev.time,
            desc: ev.desc,
            active: group.events.includes(ev.key),
            nightAfter: nightAfterDef ? {
              label: nightAfterDef.label,
              active: group.nights.includes(nightAfterDef.key)
            } : null,
            dressRule: rule ? rule.text : null,
            dressOverrides,
          };
        });
        return { ...group, timeline };
      });
    },

  }
}
